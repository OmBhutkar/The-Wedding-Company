services:
  - type: web
    name: the-wedding-company
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn wedding_company.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "yourapp.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://yourapp.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: wedding-db
          property: connectionString

databases:
  - name: wedding-db
    plan: free

